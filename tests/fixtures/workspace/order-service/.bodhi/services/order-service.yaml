name: order-service
description: Order management
port: 8080
tech_stack: [java, spring-boot]

apis:
  - protocol: http
    method: POST
    path: /api/orders
    flow: create_order

depends_on:
  - service: payment-service
    protocol: http
    apis: ["POST /api/payments/hold"]
  - service: kafka
    type: mq
    topics: [order-events]
