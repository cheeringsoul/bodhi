table: orders
description: Core orders table
database: mysql

fields:
  - name: id
    type: bigint
    description: Order primary key
    primary_key: true
  - name: user_id
    type: bigint
    description: User ID
    references: users.id
  - name: status
    type: int
    description: Order status
    state_machine: order_lifecycle
    enum:
      0: INIT
      1: PAID
      4: COMPLETED
      5: CANCELLED
  - name: total_amount
    type: decimal
    description: Order total amount

relations:
  - target: order_items
    type: one_to_many
    join: orders.id = order_items.order_id
    description: Order line items
