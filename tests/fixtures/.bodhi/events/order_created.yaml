name: order_created
description: 订单创建后发布的领域事件
channel: kafka:order-events

schema:
  - field: orderId
    type: string
    description: 订单ID
  - field: userId
    type: string
    description: 用户ID

producers:
  - fn: OrderService.create
    flow: create_order

consumers:
  - fn: NotificationHandler.onOrderCreated
    description: 发送订单通知
