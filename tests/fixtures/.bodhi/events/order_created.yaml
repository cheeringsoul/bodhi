name: order_created
description: Domain event published after order creation
channel: kafka:order-events

schema:
  - field: orderId
    type: string
    description: Order ID
  - field: userId
    type: string
    description: User ID

producers:
  - fn: OrderService.create
    flow: create_order

consumers:
  - fn: NotificationHandler.onOrderCreated
    description: Send order notification
