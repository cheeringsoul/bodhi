version: "0.1.0"
project:
  name: "test-project"
  description: "Test fixture project"
  languages: [java, python]
  frameworks: [spring-boot]

distributed:
  system: "ecommerce-platform"
  service: "order-service"
  registry: "git@github.com:org/bodhi-registry.git"

inline:
  java: javadoc
  python: docstring

runtime:
  logs:
    - name: app-log
      type: file
      path: /var/log/order-service/app.log
      format: json
      timestamp_field: "@timestamp"
      message_field: "message"
  time_window: 30s
  default_trace_field: requestId
