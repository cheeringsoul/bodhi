name: create_order
description: Order creation flow
trace_key: orderId

entry:
  type: http
  method: POST
  path: /api/orders
  auth: required(role=USER)

steps:
  - fn: OrderService.create
    intent: Receive request, orchestrate order creation
    reads:
      - request.body(userId, items, address)
    calls:
      - InventoryService.deduct
      - OrderRepository.save
    on_fail:
      - validation_failed → reject 400

  - fn: InventoryService.deduct
    remote: inventory-service
    protocol: grpc
    api: InventoryService/DeductStock
    flow_ref: inventory-service:deduct_stock
    intent: Deduct inventory
    reads:
      - inventory(productId, stock)
    writes:
      - inventory(stock) via UPDATE
    on_fail:
      - inventory_insufficient → reject 400

  - fn: OrderRepository.save
    intent: Persist order
    writes:
      - orders(id, userId, totalAmount, status=PENDING) via INSERT

entities:
  - orders
  - inventory

events:
  - order_created
