name: order_lifecycle
entity: orders
field: status
description: Order lifecycle

states:
  - id: INIT
    value: 0
    description: Awaiting payment
    transitions:
      - target: PAID
        trigger: event(payment_success)
        fn: PaymentCallback.onSuccess
      - target: CANCELLED
        trigger: user_action(cancel)
        fn: OrderService.cancel

  - id: PAID
    value: 1
    description: Payment received
    transitions:
      - target: COMPLETED
        trigger: event(delivery_confirmed)
        fn: DeliveryCallback.onConfirmed

  - id: COMPLETED
    value: 4
    description: Order completed
    terminal: true

  - id: CANCELLED
    value: 5
    description: Order cancelled
    terminal: true
