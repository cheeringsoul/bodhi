# Add this to your .github/workflows/ directory
# Validates Bodhi DSL completeness on every PR

name: Bodhi DSL Validate

on:
  pull_request:
    paths:
      - '**.java'
      - '**.py'
      - '**.go'
      - '**.ts'
      - '**.js'
      - '**.kt'
      - '.bodhi/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bodhi-engine
        run: pip install bodhi-engine

      - name: Validate DSL
        run: bodhi validate .

      - name: DSL Coverage
        if: always()
        run: bodhi stats .
