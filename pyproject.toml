[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhi-engine"
version = "0.1.0"
description = "Parse and validate Bodhi DSL annotations (@bodhi.*) for CI integration."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bodhi = "bodhi_engine.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["bodhi_engine"]
