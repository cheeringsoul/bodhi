[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhi-engine"
version = "0.1.1"
description = "Parse and validate Bodhi DSL annotations (@bodhi.*) for CI integration."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "jinja2>=3.1"]
dev = ["pytest>=7.0"]

[project.scripts]
bodhi = "bodhi_app.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["bodhi_engine", "bodhi_app"]
