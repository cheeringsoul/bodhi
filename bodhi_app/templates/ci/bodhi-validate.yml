# Add this to your .github/workflows/ directory
# Lints Bodhi DSL completeness on every PR

name: Bodhi DSL Lint

on:
  pull_request:
    paths:
      - '**.java'
      - '**.py'
      - '**.go'
      - '**.ts'
      - '**.js'
      - '**.kt'
      - '.bodhi/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bodhi-engine
        run: pip install bodhi-engine

      - name: Lint DSL
        run: bodhi lint .

      - name: DSL Coverage
        if: always()
        run: bodhi stats . | tee bodhi-stats.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodhi-stats
          path: bodhi-stats.json
