# Add this to your .github/workflows/ directory
# Posts a Bodhi impact analysis comment on every PR

name: Bodhi PR Impact Analysis

on:
  pull_request:
    paths:
      - '**.java'
      - '**.py'
      - '**.go'
      - '**.ts'
      - '**.js'
      - '**.kt'
      - '.bodhi/**'

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bodhi
        run: pip install bodhi-dsl

      - name: Run Bodhi Impact Analysis
        id: impact
        run: |
          REPORT=$(bodhi impact-pr . --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }})
          {
            echo "report<<BODHI_EOF"
            echo "$REPORT"
            echo "BODHI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.impact.outputs.report }}`;

            // Find existing Bodhi comment to update (avoid duplicate comments)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.startsWith('## Bodhi Impact Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
